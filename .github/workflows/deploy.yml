name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_PROD_CONTENT: ${{ secrets.ENV_PROD }}
        with:
          host: 80.87.102.197
          username: root
          port: 22
          key: ${{ secrets.MYSECRET }}
          command_timeout: 12m
          envs: ENV_PROD_CONTENT
          script: |
            set -e

            APP_DIR="/opt/travelio"
            REPO="https://github.com/AntonNavaUsa/new-tour-market.git"

            # Клонировать если папки нет
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Cloning repo..."
              git clone "$REPO" "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Подтянуть последний код
            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # Создать .env.prod из секрета только при первом деплое.
            # Существующий файл содержит ручные production-настройки и не должен
            # перезаписываться при каждом git push.
            if [ ! -f "$APP_DIR/.env.prod" ]; then
              if [ -n "$ENV_PROD_CONTENT" ]; then
                echo "$ENV_PROD_CONTENT" > "$APP_DIR/.env.prod"
                chmod 600 "$APP_DIR/.env.prod"
                echo ".env.prod created from secret"
              else
                echo "ERROR: $APP_DIR/.env.prod not found and ENV_PROD secret is empty!"
                exit 1
              fi
            else
              echo "Using existing .env.prod; production environment was preserved"
            fi

            # Поднять контейнеры
            echo "Building and starting containers..."
            # This compose project owns only Travelio. The shared reverse
            # proxy and its TLS volumes are managed by the infrastructure project.
            docker compose -p travelio -f docker-compose.prod.yml --env-file .env.prod up -d --build

            # Убрать старые образы
            docker image prune -f

            echo "Deploy complete!"
            echo "Frontend: http://80.87.102.197:8090"
